name: On-demand Vercel Preview

on:
  pull_request:
    paths:
      - 'vercel.json'
      - '.github/workflows/vercel-preview-on-label.yml'
      - 'scripts/check-preview-policy.mjs'
  pull_request_target:
    types: [labeled]

permissions:
  contents: read

jobs:
  check-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-preview-policy.mjs

  deploy:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["preview"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
      cancel-in-progress: false
    steps:
      # The trusted base-branch workflow calls Vercel; PR code never runs with this token.
      - name: Deploy exact PR head and post Preview URL
        uses: actions/github-script@v8
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          script: |
            const projects = {"preview":{"name":"mainstreet-advisory-ca4y","id":"prj_w3rEhIoNSXJ6Sr6NaQkGT8amPSbA"}};
            const pr = context.payload.pull_request;
            const label = context.payload.label?.name;
            const project = Object.hasOwn(projects, label) ? projects[label] : null;
            if (!project || pr.state !== 'open' || pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) {
              throw new Error('Only an approved project label on an open same-repository PR can deploy.');
            }
            if (!process.env.VERCEL_TOKEN) throw new Error('Configure the repository VERCEL_TOKEN secret first.');
            const api = async (path, body) => {
              const response = await fetch('https://api.vercel.com' + path + '?teamId=team_IWY54XRbWddq4Ip2tyYUEsbZ', {
                method: body ? 'POST' : 'GET',
                headers: { Authorization: 'Bearer ' + process.env.VERCEL_TOKEN, 'Content-Type': 'application/json' },
                ...(body ? { body: JSON.stringify(body) } : {}),
                signal: AbortSignal.timeout(30000),
              });
              if (!response.ok) throw new Error('Vercel API returned HTTP ' + response.status);
              return response.json();
            };
            // Omitting target requests Preview; preserve the branch for branch-scoped settings.
            let deployment = await api('/v13/deployments', {
              name: project.name,
              project: project.id,
              gitSource: { type: 'github', repoId: pr.head.repo.id, ref: pr.head.ref, sha: pr.head.sha },
            });
            const terminal = ['READY', 'ERROR', 'CANCELED', 'BLOCKED'];
            for (let attempt = 0; attempt < 60 && !terminal.includes(deployment.readyState); attempt++) {
              await new Promise(resolve => setTimeout(resolve, 10000));
              deployment = await api('/v13/deployments/' + deployment.id);
            }
            if (deployment.readyState !== 'READY') throw new Error('Preview did not become ready: ' + deployment.readyState);
            if (deployment.projectId !== project.id || ![null, undefined, 'preview'].includes(deployment.target) ||
                (deployment.gitSource?.sha ?? deployment.meta?.githubCommitSha) !== pr.head.sha) {
              throw new Error('Deployment project, target or SHA did not match the request.');
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: pr.number,
              body: 'Vercel Preview ready for ' + project.name + ' at `' + pr.head.sha + '`:\nhttps://' + deployment.url +
                '\n\nDeployment completed. Application smoke checks are still required.',
            });
